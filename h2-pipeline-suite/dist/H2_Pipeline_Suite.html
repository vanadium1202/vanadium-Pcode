<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H2 Pipeline Suite</title>
<meta name="description" content="Engineering workbook for hydrogen pipeline transport: repurposing, new H2 pipelines, NG blending, CGD Wobbe, safety, specifications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="app-css">/* Layout: fixed module rail on the left, working sheet on the right (inputs | results), stacking on narrow screens.
   Palette: drafting-table grey-green ground, deep pipeline teal accent, signal amber/red for status. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --surface2: #f6f8f7; --ink: #15211d; --muted: #586862; --line: #d3dbd7;
  --accent: #0b6b66; --accent-2: #0e8a83; --accent-ink: #ffffff; --accent-soft: #dcefec;
  --good: #23743a; --good-bg: #e2f2e5; --warn: #9a5b00; --warn-bg: #fdf0d8; --bad: #b3261e; --bad-bg: #fbe3e1; --info: #34558b; --info-bg: #e3eaf6;
  --c0: #0b6b66; --c1: #d0700a; --c2: #4b57a8; --c3: #b0357a; --c4: #6b7f1a; --c5: #5a6670;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-head: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #161f1c; --surface2: #1b2622; --ink: #e4ebe8; --muted: #9db0a9; --line: #2b3934;
  --accent: #3cb7ad; --accent-2: #5fd0c6; --accent-ink: #062320; --accent-soft: #173b37;
  --good: #6fd08a; --good-bg: #183323; --warn: #f2b453; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18; --info: #9db8ea; --info-bg: #1d2a40;
  --c0: #3cb7ad; --c1: #f0973a; --c2: #8f9cf0; --c3: #e47ab7; --c4: #b5cb52; --c5: #9aa8b2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161f1c; --surface2: #1b2622; --ink: #e4ebe8; --muted: #9db0a9; --line: #2b3934;
  --accent: #3cb7ad; --accent-2: #5fd0c6; --accent-ink: #062320; --accent-soft: #173b37;
  --good: #6fd08a; --good-bg: #183323; --warn: #f2b453; --warn-bg: #3a2c12; --bad: #ff8a80; --bad-bg: #3d1a18; --info: #9db8ea; --info-bg: #1d2a40;
  --c0: #3cb7ad; --c1: #f0973a; --c2: #8f9cf0; --c3: #e47ab7; --c4: #b5cb52; --c5: #9aa8b2; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
a { color: var(--accent); }
h2, h3, h4, legend { font-family: var(--font-head); text-wrap: balance; }
code { font-family: var(--font-mono); font-size: .9em; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; gap: 10px; align-items: center; }
.brand .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 18px/1 var(--font-head); }
.brand .mark sub { font-size: 11px; }
.brand b { display: block; font: 700 17px/1.1 var(--font-head); letter-spacing: .01em; }
.brand small { color: var(--muted); font-size: 12px; }
.navsel, .navsel-l { display: none; }
.ng { display: flex; flex-direction: column; gap: 1px; }
.ngt { margin: 6px 0 4px; font: 600 11px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
#nav a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: var(--r); font-size: 13.5px; }
#nav a:hover { background: var(--surface2); }
#nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--muted); }

.content { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.proj { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-right: 6px; }
main { padding: 20px 24px 60px; outline: none; }
.mh { max-width: 1100px; }
.eyebrow { margin: 0; font: 600 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.mh h2 { font-size: 26px; line-height: 1.15; margin: 6px 0 6px; font-weight: 700; }
.intro { margin: 0 0 12px; color: var(--muted); max-width: 80ch; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }

.btn { font: 500 13px/1 var(--font-body); padding: 9px 14px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.sm { padding: 7px 11px; font-size: 12.5px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btns.col { flex-direction: column; align-items: flex-start; }

.mgrid { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.inputs { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 12px 12px; margin: 0; min-width: 0; }
.sec legend, .sec h4 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 4px; margin: 0; }
.sec h4 { padding: 0 0 8px; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld label { font-size: 12.5px; color: var(--ink); line-height: 1.3; }
.fld small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.fld input, .fld select, .fld textarea, .comp input, .grid.edit input, .navsel { font: 13px var(--font-body); color: var(--ink); background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; width: 100%; min-width: 0; }
.fld input[type=number], .comp input, .grid.edit input { font-family: var(--font-mono); font-size: 12.5px; }
.inp-u { display: flex; align-items: stretch; }
.inp-u input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.inp-u span { display: grid; place-items: center; padding: 0 7px; font-size: 11.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-left: 0; border-radius: 0 4px 4px 0; white-space: nowrap; }
.fld.chk { flex-direction: row; align-items: flex-start; gap: 8px; grid-column: 1 / -1; }
.fld.chk input { width: auto; margin-top: 3px; }
.comp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.ci { display: flex; flex-direction: column; font-size: 11.5px; color: var(--muted); }

.results { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.rcard h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pagebody { display: flex; flex-direction: column; gap: 14px; max-width: 1200px; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; max-width: 95ch; }
.note.warn { color: var(--warn); }

table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.kv { width: 100%; }
.kv th { text-align: left; font-weight: 400; color: var(--ink); padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); width: 52%; }
.kv td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.kv td.num { font-family: var(--font-mono); font-size: 13px; text-align: right; white-space: nowrap; }
.kv td.txt { font-size: 13px; text-align: left; }
.kv td.u { color: var(--muted); font-size: 12px; }
.kv td.rf { white-space: nowrap; text-align: right; }
.tbl-wrap { overflow-x: auto; max-width: 100%; margin-top: 8px; }
.grid { width: 100%; font-size: 12.5px; }
.grid th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 2px solid var(--line); background: var(--surface2); white-space: nowrap; }
.grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.grid td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.grid tr.sel td { background: var(--accent-soft); font-weight: 600; }
.grid tr.hit td { background: var(--warn-bg); }
.grid.edit input { width: 80px; padding: 4px 6px; }
.grid.edit th input { width: 72px; }

.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 11px/1.5 var(--font-body); letter-spacing: .02em; white-space: nowrap; border: 1px solid transparent; }
.chip.g { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.chip.a { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.chip.r { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.chip.i { background: var(--info-bg); color: var(--info); }
a.ref { display: inline-block; font: 500 10.5px/1.4 var(--font-mono); padding: 0 4px; margin-left: 3px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); text-decoration: none; vertical-align: 1px; }
a.ref:hover { background: var(--accent); color: var(--accent-ink); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; background: var(--surface2); }
.tile b { font: 700 26px/1.1 var(--font-head); }
.tile span { color: var(--muted); font-size: 12px; }
.tile.r b { color: var(--bad); } .tile.a b { color: var(--warn); } .tile.g b { color: var(--good); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.warns { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

.chart { margin: 8px 0 4px; }
.chart figcaption, .zonefig figcaption { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.chart-wrap { overflow-x: auto; }
.chart svg { width: 100%; min-width: 420px; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { stroke: var(--muted); stroke-width: 1; }
.chart .tk, .zonefig .tk { fill: var(--muted); font: 10.5px var(--font-mono); }
.chart .al { fill: var(--ink); font: 11.5px var(--font-body); }
.chart .hl { stroke: var(--muted); stroke-dasharray: 5 4; stroke-width: 1; }
.chart .hlt { fill: var(--muted); font: 10.5px var(--font-body); }
.chart .ln { stroke-width: 2.2; fill: none; }
.chart .ln.dash { stroke-dasharray: 6 4; }
.s0 { stroke: var(--c0); fill: var(--c0); } .s1 { stroke: var(--c1); fill: var(--c1); } .s2 { stroke: var(--c2); fill: var(--c2); }
.s3 { stroke: var(--c3); fill: var(--c3); } .s4 { stroke: var(--c4); fill: var(--c4); } .s5 { stroke: var(--c5); fill: var(--c5); }
.chart path.ln { fill: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend .sw { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
.legend .sw.s0 { border-color: var(--c0); } .legend .sw.s1 { border-color: var(--c1); } .legend .sw.s2 { border-color: var(--c2); } .legend .sw.s3 { border-color: var(--c3); } .legend .sw.s4 { border-color: var(--c4); } .legend .sw.s5 { border-color: var(--c5); }
.legend .sw.dash { border-top-style: dashed; }

.zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.zone-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.zonefig { margin: 0; min-width: 0; }
.zonefig svg { width: min(100%, 300px); height: auto; }
.zone { stroke-width: 1.5; fill-opacity: .16; }
.z1 { fill: var(--c2); stroke: var(--c2); } .z2 { fill: var(--c3); stroke: var(--c3); } .z3 { fill: var(--c1); stroke: var(--c1); }
.z4 { fill: var(--bad); stroke: var(--bad); } .z5 { fill: var(--warn); stroke: var(--warn); } .z6 { fill: var(--c5); stroke: var(--c5); }
.zsrc { fill: var(--ink); } .zscale { stroke: var(--muted); stroke-width: 1.5; }
.zleg { list-style: none; padding: 0; margin: 0; font-size: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.zsw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
.zsw.z1 { background: color-mix(in srgb, var(--c2) 25%, transparent); border-color: var(--c2); } .zsw.z2 { background: color-mix(in srgb, var(--c3) 25%, transparent); border-color: var(--c3); }
.zsw.z3 { background: color-mix(in srgb, var(--c1) 25%, transparent); border-color: var(--c1); } .zsw.z4 { background: color-mix(in srgb, var(--bad) 25%, transparent); border-color: var(--bad); }
.zsw.z5 { background: color-mix(in srgb, var(--warn) 25%, transparent); border-color: var(--warn); } .zsw.z6 { background: color-mix(in srgb, var(--c5) 25%, transparent); border-color: var(--c5); }

.spec-doc { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; background: var(--surface2); }
.spec-doc header h3 { font-size: 18px; margin: 4px 0; }
.spec-doc h4 { margin: 14px 0 4px; font-size: 14px; }
.spec-doc p, .spec-doc li { max-width: 90ch; }
.spec-doc table { width: 100%; }
.spec-doc td, .spec-doc th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; font-size: 12.5px; }

.lib-up { display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.confirm { margin-top: 10px; padding: 10px; border: 1px solid var(--bad); border-radius: var(--r); background: var(--bad-bg); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm p { margin: 0; flex-basis: 100%; }

.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 12px; border-radius: var(--r); font-size: 13px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast .btn { flex-shrink: 0; }
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 60; padding: 16px; }
.dlg-in { background: var(--surface); border-radius: var(--r); padding: 16px; width: min(760px, 100%); display: flex; flex-direction: column; gap: 10px; }
.dlg-in h3 { margin: 0; }
.dlg-in textarea { width: 100%; font: 12px var(--font-mono); background: var(--surface2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }

.report .mgrid, .report .toolbar { display: block; }
.rep-h p { margin: 4px 0; }

@media (max-width: 1150px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .inputs { max-width: 760px; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; }
  .side #nav, .side-foot { display: none; }
  .navsel { display: block; flex: 1 1 200px; }
  .topbar, main { padding-left: 16px; padding-right: 16px; }
  .cols2, .zones { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lib-up { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) { .formgrid { grid-template-columns: minmax(0, 1fr); } .comp { grid-template-columns: repeat(3, minmax(0, 1fr)); } .mh h2 { font-size: 21px; } .kv th { width: 45%; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
@media print { .side, .topbar, .toolbar, .inputs { display: none !important; } .app, .mgrid { display: block; } }
@media (max-width: 600px) {
  .kv tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .kv th { grid-column: 1 / -1; width: auto; border-bottom: 0; padding: 0; color: var(--muted); font-size: 12.5px; }
  .kv td { border-bottom: 0; padding: 2px 6px 2px 0; }
  .kv td.num { text-align: left; white-space: normal; overflow-wrap: anywhere; }
}
</style>
</head>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true">H<sub>2</sub></span><div><b>H2 Pipeline Suite</b><small>Transport · integrity · safety</small></div></div>
    <label class="navsel-l" for="navSel">Module</label>
    <select id="navSel" class="navsel"></select>
    <nav id="nav" aria-label="Modules"></nav>

  </aside>
  <div class="content">
    <div class="topbar"><p class="proj"><span>Project</span> <b id="projTitle"></b></p><button class="btn sm ghost" type="button" id="themeBtn">Theme</button></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" role="status"></div>
<div id="copyDlg" class="dlg" hidden><div class="dlg-in"><h3>Copy the file content</h3><p class="note">This viewer blocked the download. Select all and copy, then paste into a text editor and save with the file name shown.</p><textarea id="copyArea" rows="14" aria-label="File content"></textarea><button class="btn" type="button" id="copyClose">Close</button></div></div>
<script>/* =====================================================================
   H2 Pipeline Suite — calculation engine
   Pure functions only (no DOM). Runs in the browser and in Node.js
   (tests/run_tests.js). Internal units are SI: Pa, K, m, kg, s, J.
   Every correlation carries a reference tag [Rxx] that resolves in
   data.js -> REFS.
   ===================================================================== */
(function (root) {
  'use strict';

  const RU = 8.314462618;          // J/(mol K) universal gas constant
  const PATM = 101325;             // Pa
  const G = 9.80665;               // m/s2
  const M_AIR = 28.9626;           // g/mol [R40 ISO 6976]
  const Z_AIR = 0.99958;           // air compressibility 15 C, 1 atm [R40]
  const T15 = 288.15;

  /* ---------------------------------------------------------------
     Component data
     M g/mol; Tc K; Pc bar; w acentric; Hs/Hi molar gross/net CV at 15 C
     (kJ/mol, ISO 6976:2016 [R40]); s summation factor 15 C [R40];
     cp: Cp/R = A + B T + C T^2 + D/T^2 (Smith-Van Ness-Abbott App. C [R41]);
     mu0 viscosity at 273.15 K (Pa s) & Sutherland C (K) [R42];
     LFL/UFL vol% in air [R43]; o2 stoich mol O2 / mol; nC carbon atoms;
     Tad stoich adiabatic flame temperature K [R43]
     --------------------------------------------------------------- */

        ['Leakage energy loss', fmt(ng.leakE, 4), fmt(b.leakE, 4), `vol × ${fmt(b.leakV, 2)}`, '% of energy'],
        ['Outlet velocity', fmt(ng.vOut, 1), fmt(b.vOut, 1), b.vOut > b.vEros ? chip('r', '> erosional') : chip('g', 'OK'), 'm/s'],
        ['API RP 14E erosional velocity (C = 100)', fmt(ng.vEros, 1), fmt(b.vEros, 1), ref('R52'), 'm/s'],
        ['Line-pack energy', fmt(ng.lpGJ / 1000, 1), fmt(b.lpGJ / 1000, 1), pct(b.lpGJ / ng.lpGJ), 'TJ'],
        ['Wobbe index (gross)', fmt(ng.W, 2), fmt(b.W, 2), pct(b.W / ng.W - 1).replace(' %', ' % Δ'), 'MJ/m³'],
        ['H2 partial pressure at MAOP', '0', fmt(b.pH2, 2), '', 'bar(a)']
      ];
      let html = card(`Natural gas vs ${v.h2} % H2 blend — ${v.mode === 'energy' ? 'same energy delivered' : 'same pressures'}`, table(['Quantity', 'Natural gas', `${v.h2} % H2`, 'Ratio / status', 'Unit'], rows, { num: [0, 1, 1, 0, 0] }) +
        note(`Energy loss = compressor driver energy needed to restore the pressure drop of this segment, divided by the energy delivered. ${v.driver === 'gt' ? 'With gas-turbine drivers this is fuel gas consumed from the line.' : 'With electric drivers this is grid electricity.'} Method: isothermal general flow equation ${ref('R45')} and multi-stage isentropic compression ${ref('R46')}.`));
      html += card('Effect of blend level', lineChart({ title: 'Energy capacity and compression energy vs H2 fraction', xLabel: 'H2 in blend (mol %)', yLabel: 'Ratio to natural gas', series: [{ name: 'Max energy capacity (same pressures)', pts: sweep.map(s => [s.x, s.capMW / ng.capMW]) }, { name: 'Compression energy per unit energy delivered', pts: sweep.map(s => [s.x, s.lossPct / ng.lossPct]), ci: 1 }, { name: 'Standard volume flow for same energy', pts: sweep.map(s => [s.x, s.q / ng.q * (v.mode === 'energy' ? 1 : ng.MW / s.MW)]), ci: 2, dash: true }], vLines: [{ x: v.h2, label: 'Selected' }] }) +
        lineChart({ title: 'Outlet velocity vs H2 fraction', xLabel: 'H2 in blend (mol %)', yLabel: 'm/s', series: [{ name: 'Outlet velocity', pts: sweep.map(s => [s.x, s.vOut]), ci: 3 }, { name: 'Erosional velocity (API RP 14E)', pts: sweep.map(s => [s.x, s.vEros]), ci: 4, dash: true }] }) +
        (v.mode === 'energy' && sweep.some(s => !s.feasible) ? note(`Above ~${sweep.find(s => !s.feasible).x} % H2 the fixed energy demand cannot be delivered within MAOP for this segment — more compression stations or looping would be needed.`, 'warn') : ''));
      const tol = D.TOLERANCE.map(t => [t.c, fmt(t.pct, t.pct < 1 ? 1 : 0) + ' %', chip(v.h2 <= t.pct ? 'g' : 'r', v.h2 <= t.pct ? 'Within' : 'Exceeds'), t.note, ref(...t.src.split(', '))]);
      html += card('Materials exposure at this blend', kv([
        ['H2 partial pressure at MAOP', fmt(b.pH2, 2), 'bar(a)', ref('R39')],
        ['Fracture toughness', b.pH2 > 0 ? 'Reduced — knock-down applies even below 1 bar H2' : '—', '', ref('R39', 'R38')],
        ['Fatigue crack growth (intermediate ΔK)', b.pH2 > 0 ? `×${fmt(Math.sqrt(Math.max(b.pH2, 0.01) / 1060), 3)} of 106 MPa CC2938 low-ΔK rate (still ≫ air)` : '—', '', ref('R14', 'R15')],
        ['Recommended', b.pH2 > 0 ? 'Assess flaws with Fatigue & fracture module at this pH2; hardness ≤ 250/235 HV10' : '', '', ref('R2')]
      ])) + card('End-use & component tolerance check', table(['Component / end use', 'Typical max H2', 'At ' + v.h2 + ' %', 'Note', 'Ref'], tol));
      return { html, csv: { name: 'blend_sweep', rows: [['H2_pct', 'cap_MW', 'MW_delivered', 'mdot_kg_s', 'MMSCMD', 'p_inlet_barg', 'comp_power_MW', 'driver_MW', 'energy_loss_pct', 'v_out_m_s', 'linepack_TJ', 'leak_energy_pct', 'Wobbe'], ...sweep.map(s => [s.x, s.capMW.toFixed(1), s.MW.toFixed(1), s.mdot.toFixed(3), s.q.toFixed(3), s.p1.toFixed(2), s.power.toFixed(3), s.drvIn.toFixed(3), s.lossPct.toFixed(4), s.vOut.toFixed(2), (s.lpGJ / 1000).toFixed(2), s.leakE.toFixed(5), s.W.toFixed(3)])] } };
    }
  });

  /* ================================================================ NEW DESIGN */
  const flowToMdot = (c, unit, val) => unit === 'MW' ? E.mdotFromMW(c, val, basis()) : unit === 'kgs' ? val : unit === 'tpd' ? val / 86.4 : val * 1e6 / 86400 * E.isoProps(c).rho;
  MODS.push({
    id: 'design', group: 'Transport routes', nav: 'New H2 pipeline design', title: 'New hydrogen pipeline — hydraulic and mechanical design (ASME B31.12)',
    intro: 'Sizes a new pipeline for a hydrogen (or blend) duty: evaluates every standard NPS, selects the smallest feasible size, computes wall thickness with the B31.12 material performance factor, hydrotest, ductile-fracture arrest toughness (BTCM) and compression. The selected design feeds the <a href="#linepipe">line pipe specification</a> and <a href="#equipment">equipment datasheets</a>.',
    sections: [
      { title: 'Duty', fields: [
        { k: 'h2', l: 'Hydrogen content', u: 'mol %', v: 100 },
        { k: 'unit', l: 'Flow unit', t: 'sel', o: [['MW', 'MW (energy basis per settings)'], ['kgs', 'kg/s'], ['tpd', 'tonne/day'], ['mmscmd', 'MMSCMD (15 °C)']], v: 'tpd' },
        { k: 'flow', l: 'Design flow', u: '', v: 500 },
        { k: 'len', l: 'Length', u: 'km', v: 150 },
        { k: 'pin', l: 'Inlet (compressor discharge) pressure', u: 'barg', v: 60 },
        { k: 'pdes', l: 'Design pressure', u: 'barg', v: 65 },
        { k: 'pmin', l: 'Minimum delivery pressure', u: 'barg', v: 30 },
        { k: 'psrc', l: 'Source pressure (electrolyser / plant)', u: 'barg', v: 30 },
        { k: 'temp', l: 'Flowing temperature', u: '°C', v: 20 }, { k: 'dz', l: 'Elevation change', u: 'm', v: 0 }] },
      { title: 'Mechanical design', fields: [
        { k: 'opt', l: 'B31.12 method', t: 'sel', o: [['A', 'Option A — prescriptive'], ['B', 'Option B — performance-based']], v: 'A', ref: 'R2' },
        { k: 'loc', l: 'Location class', t: 'sel', o: locOpts, v: 1 },
        { k: 'grade', l: 'Grade', t: 'sel', o: gradeOpts, v: 'X52 (L360)', ref: 'R3' },
        { k: 'tdes', l: 'Design temperature', u: '°C', v: 50 }, { k: 'tmin', l: 'Minimum design temperature', u: '°C', v: -10 },
        { k: 'ca', l: 'Corrosion allowance', u: 'mm', v: 0, h: 'Dry H2: 0 typical; add for blends with water risk' },
        { k: 'dtMax', l: 'Max D/t (constructability)', u: '–', v: 96 },
        { k: 'tMin', l: 'Minimum wall', u: 'mm', v: 6.4 }] },
      { title: 'Hydraulic criteria', fields: [
        { k: 'rough', l: 'Internal roughness', u: 'mm', v: 0.0457, h: '0.005–0.01 with internal flow coat' }, { k: 'eff', l: 'Efficiency factor', u: '–', v: 0.95 },
        { k: 'vmax', l: 'Max velocity', u: 'm/s', v: 20, h: 'Noise/erosion/ILI-speed limit; EIGA velocity guidance ' }, { k: 'nps', l: 'Force NPS (0 = automatic)', u: 'in', v: 0, step: 1 },
        { k: 'eta', l: 'Compressor isentropic efficiency', u: '–', v: 0.78 }] }
    ],
    compute(v) {
      const t = T(); const c = mix(v.h2); const mdot = flowToMdot(c, v.unit, v.flow); const Tk = v.temp + 273.15; const g = U.gradeBy(v.grade);
      const Tf = E.tempDerating(v.tdes); const F = (v.opt === 'B' ? t.F_B : t.F_A)[v.loc];
      const hf = v.opt === 'B' ? 1 : E.hfLookup(t.hf, g.smts, v.pdes / 10).hf;
      const cands = [];
      for (const [nps, OD] of D.PIPE_OD) {
        if (OD < 100) continue;
        const treq = v.pdes / 10 * OD / (2 * g.smys * F * Tf * hf) + v.ca;
        const tsel = D.WALLS.find(w => w >= Math.max(treq, v.tMin, OD / v.dtMax)) || NaN;
        if (!isFinite(tsel)) continue;
        const ID = (OD - 2 * tsel) / 1000; const A = Math.PI * ID * ID / 4;
        const out = E.pipeOutlet({ c, D: ID, L: v.len * 1000, p1: bar(v.pin), mdot, T: Tk, rough: v.rough / 1000, E: v.eff, dz: v.dz });
        const p2 = barg(out.p2); const st2 = isFinite(out.p2) ? E.state(c, out.p2, Tk) : null; const vOut = st2 ? mdot / (st2.rho * A) : Infinity;
        const ok = isFinite(p2) && p2 >= v.pmin && vOut <= v.vmax;
        cands.push({ nps, OD, treq, tsel, ID, p2, vOut, ok, hoop: v.pdes * OD / (20 * tsel) / g.smys * 100, steel: Math.PI * (OD - tsel) * tsel * 7.85 / 1000 });
      }
      let sel = v.nps > 0 ? cands.find(x => x.nps === v.nps) : cands.find(x => x.ok);
      if (!sel) sel = cands[cands.length - 1];
      let html = card('Size screening (all standard NPS)', table(['NPS', 'OD mm', 't req mm', 't sel mm', 'Outlet barg', 'Outlet v m/s', 'Hoop % SMYS', 'Steel t/km', 'Status'],
        cands.map(x => ({ _cls: x === sel ? 'sel' : '', cells: [x.nps + '"', fmt(x.OD, 1), fmt(x.treq, 2), fmt(x.tsel, 1), isFinite(x.p2) ? fmt(x.p2, 1) : 'infeasible', isFinite(x.vOut) ? fmt(x.vOut, 1) : '—', fmt(x.hoop, 1), fmt(x.steel, 1), x.ok ? chip('g', 'Feasible') : chip('r', !isFinite(x.p2) || x.p2 < v.pmin ? 'Δp too high' : 'Velocity')] })), { num: [0, 1, 1, 1, 1, 1, 1, 1, 0] }) +
        note(`t = P·D/(2·S·F·E·T·Hf) + CA with F = ${F}, Hf = ${fmt(hf, 3)}, T = ${fmt(Tf, 3)}; wall rounded up to the next standard thickness, D/t ≤ ${v.dtMax}. ${ref('R2')}`));
      if (!sel) return { html };
      const P0 = v.pdes / 10; const hydroRatio = Math.max(t.hydro[v.loc], 1.25); // 1.25 floor adopted for H2 service (tool default)
      const bt = E.btcm({ D: sel.OD, t: sel.tsel, SMYS: g.smys, P0: P0 + 0.101, T: Tk, c });
      const cvnReq = Math.max(t.limits.cvnMin, isFinite(bt.cvn) ? (bt.cvnLeis || bt.cvn) : 0);
      const comp = v.pin > v.psrc ? E.compressor({ c, mdot, ps: bar(v.psrc), pd: bar(v.pin), Ts: Tk, eta: v.eta, maxRatio: 3 }) : null;
      const lp = E.linepack({ c, D: sel.ID / 1, L: v.len * 1000, p1: bar(v.pin), p2: bar(Math.max(sel.p2, 0)), T: Tk });
      const prof = []; for (let i = 0; i <= 20; i++) { const Li = v.len * 1000 * i / 20; const o = i ? E.pipeOutlet({ c, D: sel.ID, L: Li, p1: bar(v.pin), mdot, T: Tk, rough: v.rough / 1000, E: v.eff, dz: v.dz * i / 20 }) : { p2: bar(v.pin) }; prof.push([Li / 1000, barg(o.p2)]); }
      const maop = E.barlowP(g.smys, sel.tsel - v.ca, sel.OD, F, 1, Tf, v.opt === 'B' ? 1 : E.hfLookup(t.hf, g.smts, v.pdes / 10).hf) * 10;
      html += card(`Selected design: ${sel.nps}" × ${fmt(sel.tsel, 1)} mm ${esc(v.grade)} PSL2`, kv([
        ['Mass flow / energy flow', `${fmt(mdot, 3)} kg/s / ${fmt(E.energyMW(c, mdot, basis()), 0)} MW`, basis()],
        ['Standard volume flow', fmt(E.stdFlow(c, mdot) * 86400 / 1e6, 3), 'MMSCMD'],
        ['Design pressure / max allowable (with selected wall)', `${fmt(v.pdes, 1)} / ${fmt(maop, 1)}`, 'barg', ref('R2')],
        ['Hoop stress at design pressure', fmt(sel.hoop, 1), '% SMYS'],
        ['Hydrostatic test pressure (min.)', `${fmt(v.pdes * hydroRatio, 1)} (${hydroRatio} × DP; ≥ 1.25 used for H2) → ${fmt(v.pdes * hydroRatio * sel.OD / (20 * sel.tsel) / g.smys * 100, 0)} % SMYS`, 'barg', ref('R60')],
        ['Outlet pressure at design flow', fmt(sel.p2, 1), 'barg', ref('R45')],
        ['Max velocity (outlet)', fmt(sel.vOut, 1), 'm/s'],
        ['Line pack (operating)', `${fmt(lp.mass / 1000, 1)} t / ${fmt(lp.energyGJ / 1000, 1)} TJ`, ''],
        ['Ductile-fracture arrest CVN (BTCM)', isFinite(bt.cvn) ? fmt(bt.cvn, 0) + (bt.cvnLeis ? ` (Leis-corrected ${fmt(bt.cvnLeis, 0)})` : '') : bt.note, 'J', ref('R18', 'R20')],
        ['Specified CVN (max of arrest and 40 J floor) at ' + v.tmin + ' °C', fmt(cvnReq, 0), 'J (full size)', ref('R19')],
        ['Decompression wave speed at initial state', fmt(bt.c0, 0), 'm/s'],
        comp ? ['Inlet compression ' + v.psrc + ' → ' + v.pin + ' barg', `${fmt(comp.power / 1e6, 2)} MW, ${comp.stages} stage(s), Td ${fmt(comp.Td - 273.15, 0)} °C`, '', ref('R46', 'R47')] : null,
        comp ? ['Compression energy / energy transported', fmt(comp.power / 1e6 / E.energyMW(c, mdot, basis()) * 100, 2), '%'] : null
      ]) + note('Pure H2 decompresses at ~1 200–1 300 m/s, so running ductile fracture is rarely governing; blends with heavy hydrocarbons need a full GASDECOM check. ' + ref('R18')));
      html += card('Pressure profile', lineChart({ title: 'Pressure along the pipeline at design flow', xLabel: 'Distance (km)', yLabel: 'barg', series: [{ name: 'Pressure', pts: prof }], hLines: [{ y: v.pmin, label: 'Min delivery' }, { y: v.pdes, label: 'Design pressure' }] }));
      S().design = { nps: sel.nps, OD: sel.OD, WT: sel.tsel, grade: v.grade, smys: g.smys, smts: g.smts, pdes: v.pdes, maop, pin: v.pin, pmin: v.pmin, h2: v.h2, mdot, vmax: sel.vOut, cvn: cvnReq, tmin: v.tmin, opt: v.opt, loc: v.loc, len: v.len, temp: v.temp, sos: E.state(c, bar(v.pin), Tk).c, power: comp ? comp.power / 1e3 : 0, stages: comp ? comp.stages : 0, psrc: v.psrc, hydro: v.pdes * hydroRatio };
      U.save();
      return { html, csv: { name: 'new_pipeline_size_screening', rows: [['NPS', 'OD_mm', 't_req_mm', 't_sel_mm', 'p_out_barg', 'v_out_m_s', 'hoop_pct_SMYS', 'steel_t_per_km', 'feasible'], ...cands.map(x => [x.nps, x.OD, x.treq.toFixed(2), x.tsel, x.p2.toFixed(2), x.vOut.toFixed(2), x.hoop.toFixed(1), x.steel.toFixed(1), x.ok])] } };
    }
  });

  /* ================================================================ CGD */
  MODS.push({
    id: 'cgd', group: 'Transport routes', nav: 'CGD blending & Wobbe', title: 'Hydrogen blending in city gas distribution — Wobbe index & interchangeability',
    intro: 'Shows how the blend level changes Wobbe index, heating value, appliance heat input, flame speed and CO₂, against the selected gas-quality range, and lists component limits for CGD networks (including India PNGRB preliminary limits).',
    sections: [
      { title: 'Blend & standard', fields: [
        { k: 'h2', l: 'Hydrogen in blend', u: 'mol %', v: 10 },
        { k: 'hmax', l: 'Sweep up to', u: 'mol %', v: 30 },
        { k: 'std', l: 'Wobbe acceptance range', t: 'sel', o: () => Object.keys(D.WOBBE_STD), v: 'UK GS(M)R (from Apr 2025)', ref: 'R36' },
        { k: 'wmin', l: 'Custom range — min', u: 'MJ/m³', v: 47.0 }, { k: 'wmax', l: 'Custom range — max', u: 'MJ/m³', v: 52.0 },
        { k: 'band', l: 'Appliance adjustment band about base-gas Wobbe', u: '± %', v: 5, h: 'Heat-input tolerance of installed appliances' }] },
      { title: 'Network (for capacity note)', fields: [
        { k: 'pnet', l: 'Network operating pressure', u: 'barg', v: 4 }, { k: 'temp', l: 'Gas temperature', u: '°C', v: 15 }] }
    ],
    compute(v) {
      const rng = v.std === 'Custom range' ? [v.wmin, v.wmax] : D.WOBBE_STD[v.std];
      const base = E.isoProps(mix(0)); const sl = x => { const tb = D.SL_TABLE; for (let i = 1; i < tb.length; i++) if (x <= tb[i][0]) return tb[i - 1][1] + (tb[i][1] - tb[i - 1][1]) * (x - tb[i - 1][0]) / (tb[i][0] - tb[i - 1][0]); return tb[tb.length - 1][1]; };
      const rows = []; const pts = []; let maxStd = null, maxBand = null;
      for (let x = 0; x <= v.hmax + 1e-9; x += (v.hmax <= 30 ? 1 : 5)) {
        const c = mix(x), i = E.isoProps(c), f = E.flammability(c);
        const dW = (i.W / base.W - 1) * 100; const inStd = i.W >= rng[0] && i.W <= rng[1]; const inBand = Math.abs(dW) <= v.band;
        if (inStd) maxStd = x; if (inBand) maxBand = x;
        rows.push({ x, i, f, dW, inStd, inBand, sl: sl(x), co2: (1 - E.co2PerGJ(c) / E.co2PerGJ(mix(0))) * 100, vol: base.HsV / i.HsV });
        pts.push([x, i.W]);
      }
      const at = rows.reduce((a, r) => Math.abs(r.x - v.h2) < Math.abs(a.x - v.h2) ? r : a, rows[0]);
      const cur = { c: mix(v.h2) }; cur.i = E.isoProps(cur.c); cur.dW = (cur.i.W / base.W - 1) * 100;
      let html = card(`At ${v.h2} % H2`, kv([
        ['Wobbe index (gross, 15/15 °C)', `${fmt(cur.i.W, 2)} (base ${fmt(base.W, 2)})`, 'MJ/m³', ref('R40')],
        ['Change in Wobbe → appliance heat input at fixed nozzle & pressure', fmt(cur.dW, 2), '%'],
        ['Gross CV', `${fmt(cur.i.HsV, 2)} (base ${fmt(base.HsV, 2)})`, 'MJ/m³'],
        ['Relative density', fmt(cur.i.d, 4), '–'],
        ['Volume to deliver the same energy (billing volume)', '+' + fmt((base.HsV / cur.i.HsV - 1) * 100, 1), '%'],
        ['Network energy capacity at same pressure drop (∝ Wobbe)', fmt(cur.i.W / base.W * 100, 1), '% of NG'],
        ['Stoichiometric laminar burning velocity', `${fmt(sl(v.h2), 2)} (NG ${fmt(sl(0), 2)})`, 'm/s', ref('R49')],
        ['CO₂ reduction per unit energy', fmt((1 - E.co2PerGJ(cur.c) / E.co2PerGJ(mix(0))) * 100, 1), '%'],
        [`Within ${esc(v.std)} [${rng[0]}–${rng[1]}]`, cur.i.W >= rng[0] && cur.i.W <= rng[1] ? chip('g', 'Yes') : chip('r', 'No'), ''],
        [`Max H2 within range / within ±${v.band} % band`, `${maxStd ?? '—'} % / ${maxBand ?? '—'} %`, 'mol %']
      ]));
      html += card('Wobbe index vs hydrogen fraction', lineChart({ xLabel: 'H2 in blend (mol %)', yLabel: 'Wobbe index MJ/m³', yMin: Math.min(rng[0], ...pts.map(p => p[1])) - 1, yMax: Math.max(rng[1], base.W) + 1, series: [{ name: 'Blend Wobbe index', pts }, { name: `Base −${v.band} % appliance band`, pts: pts.map(p => [p[0], base.W * (1 - v.band / 100)]), ci: 1, dash: true }], hLines: [{ y: rng[0], label: 'Range min' }, { y: rng[1], label: 'Range max' }], vLines: [{ x: v.h2, label: v.h2 + ' %' }] }) +
        note('EN 437 test gas G222 (23 % H2) is the light-back limit gas for 2H appliances — appliances certified to it have demonstrated flashback resistance at that blend. ' + ref('R50')));
      html += card('Interchangeability table', table(['H2 %', 'HHV MJ/m³', 'Rel. density', 'Wobbe MJ/m³', 'ΔW %', 'S_L m/s', 'CO₂ cut %', 'Range', `±${v.band} % band`], rows.map(r => [r.x, fmt(r.i.HsV, 2), fmt(r.i.d, 4), fmt(r.i.W, 2), fmt(r.dW, 2), fmt(r.sl, 2), fmt(r.co2, 1), chip(r.inStd ? 'g' : 'r', r.inStd ? 'In' : 'Out'), chip(r.inBand ? 'g' : 'a', r.inBand ? 'In' : 'Out')]), { num: [1, 1, 1, 1, 1, 1, 1, 0, 0] }));
      const cgdT = D.TOLERANCE.filter(t => /India|CGD|PE80|appliance|burner|meter|chromat|CNG|engine/i.test(t.c));
      html += card('CGD component limits', table(['Component', 'Limit', `At ${v.h2} %`, 'Note', 'Ref'], cgdT.map(t => [t.c, t.pct + ' %', chip(v.h2 <= t.pct ? 'g' : 'r', v.h2 <= t.pct ? 'OK' : 'Exceeds'), t.note, ref(...t.src.split(', '))])) +
        note('India: PNGRB has issued preliminary component limits (2024) and approved pilots at 2–8 % (e.g. NTPC–GGL Kavas 8 %); no final national cap is notified yet. ' + ref('R37'), 'warn'));
      return { html, csv: { name: 'cgd_wobbe_table', rows: [['H2_pct', 'HHV_MJ_m3', 'rel_density', 'Wobbe_MJ_m3', 'dW_pct', 'SL_m_s', 'CO2_cut_pct', 'in_range', 'in_band'], ...rows.map(r => [r.x, r.i.HsV.toFixed(3), r.i.d.toFixed(5), r.i.W.toFixed(3), r.dW.toFixed(3), r.sl.toFixed(3), r.co2.toFixed(2), r.inStd, r.inBand])] } };
    }
  });
})();

/* =====================================================================
   Modules part 2: ILI & defects, Fatigue & fracture, Hydrogen safety,
   Repair, Operations & integrity
   ===================================================================== */
(function () {
  'use strict';
  const E = window.H2E, D = window.H2D, U = window.H2U;
  const { fmt, ref, chip, kv, table, card, note, lineChart, esc } = U;
  const MODS = window.H2M;
  const S = () => U.S;
  const T = () => S().tables;
  const bar = p => p * 1e5 + E.PATM;
  const mix = h2 => E.blend(S().gas, h2);
  const gradeOpts = () => D.GRADES.map(g => g.g);
  const steel = v => { const g = U.gradeBy(v.grade); return { smys: v.smysO > 0 ? v.smysO : g.smys, smts: g.smts }; };
  const pipe = () => [
    { k: 'OD', l: 'Outside diameter', u: 'mm', v: 610, share: 'OD' }, { k: 'WT', l: 'Wall thickness', u: 'mm', v: 9.5, share: 'WT' },
    { k: 'grade', l: 'Grade', t: 'sel', o: gradeOpts, v: 'X52 (L360)', share: 'grade' }, { k: 'smysO', l: 'SMYS override (0 = grade)', u: 'MPa', v: 0, share: 'smysO' }];

  /* ---------- synthetic samples ---------- */

  MODS.push({
    id: 'safety', group: 'Safety', nav: 'Hydrogen safety', title: 'Hydrogen safety — leak and rupture consequences, safe zones',
    intro: 'Calculates release rate, jet-fire flame length and thermal radiation, flammable-cloud extent (LFL, ½ LFL), explosion overpressure (TNT equivalence) for a <b>leak</b>, and the potential impact radius and thermal zones for a full-bore <b>rupture</b>. Works for natural gas, blends and pure hydrogen.',
    sections: [
      { title: 'Pipeline & gas', fields: [
        { k: 'OD', l: 'Outside diameter', u: 'mm', v: 610, share: 'OD' }, { k: 'WT', l: 'Wall thickness', u: 'mm', v: 9.5, share: 'WT' },
        { k: 'p', l: 'Operating pressure', u: 'barg', v: 55.8 }, { k: 'temp', l: 'Gas temperature', u: '°C', v: 15, share: 'temp' },
        { k: 'h2', l: 'Hydrogen content', u: 'mol %', v: 100 }] },
      { title: 'Leak scenario', fields: [
        { k: 'hole', l: 'Leak hole diameter', u: 'mm', v: 25 },
        { k: 'holes', l: 'Additional hole sizes for table (mm, comma separated)', t: 'txt', v: '5, 10, 50, 100' },
        { k: 'cd', l: 'Discharge coefficient', u: '–', v: 0.85 },
        { k: 'xr', l: 'Radiant fraction (0 = automatic)', u: '–', v: 0, ref: ['R24', 'R6'] },
        { k: 'tau', l: 'Atmospheric transmissivity', u: '–', v: 1.0 },
        { k: 'texp', l: 'Exposure time (for fatality probit)', u: 's', v: 30, ref: 'R28' },
        { k: 'yield', l: 'TNT-equivalence yield', u: '%', v: 10, ref: 'R26' }] },
      { title: 'Rupture scenario', fields: [
        { k: 'tdel', l: 'Delayed-ignition release time (VCE estimate)', u: 's', v: 10 },
        { k: 'ffr', l: 'Fraction of released mass in flammable range', u: '–', v: 0.25 }] }
    ],
    compute(v) {
      const c = mix(v.h2); const fl = E.flammability(c); const iso = E.isoProps(c); const Tk = v.temp + 273.15; const p0 = bar(v.p); const t = T();
      const Hc = iso.HiM * 1e6; const Xr = v.xr > 0 ? v.xr : E.defaultXr(c);
      const leak = d => {
        const rel = E.release({ c, p0, T0: Tk, dHole: d / 1000, Cd: v.cd }); const f = E.flameLength(c, rel);
        const Q = rel.mdot * Hc / 1000; // kW
        const rad = t.rad.map(x => ({ ...x, r: E.pointSourceDistance(Q, Xr, v.tau, x.q) }));
        const xL = E.jetLFLDistance(c, rel, fl.LFL / 100), xH = E.jetLFLDistance(c, rel, fl.LFL / 200);
        const fm = E.jetFlammableMass(c, rel, fl.LFL / 100, fl.UFL / 100); const W = fm.mass * Hc * v.yield / 100 / 4.68e6;
        const op = t.op.map(x => ({ ...x, r: W > 0 ? E.distanceForOverpressure(W, x.kpa) : 0 }));
        const pr = q => E.probitFatality(q, v.texp);
        const findQ = target => { let lo = 0.5, hi = 500; for (let i = 0; i < 60; i++) { const m = Math.sqrt(lo * hi); if (pr(m) < target) lo = m; else hi = m; } return hi; };
        const r1 = E.pointSourceDistance(Q, Xr, v.tau, findQ(0.01)), r50 = E.pointSourceDistance(Q, Xr, v.tau, findQ(0.5));
        return { d, rel, f, Q, rad, xL, xH, fm, W, op, r1, r50 };
      };
      const L0 = leak(v.hole);
      const D_m = (v.OD - 2 * v.WT) / 1000; const pir = t.pir; const fH = (c.H2 || 0) * E.COMP.H2.Hi / iso.HiMol;

      const obj = (key, title, refs) => card(title, `<div class="formgrid">${Object.entries(t[key]).map(([k, x]) => `<div class="fld"><label for="o_${key}_${k}">${k}</label><input id="o_${key}_${k}" type="${typeof x === 'boolean' ? 'checkbox' : 'number'}" step="any" data-obj="${key}.${k}" value="${x}"/></div>`).join('')}</div>` + (refs || ''));
      return card('ASME B31.12 Table IX-5A — material performance factor Hf ' + ref('R2'), hf + note('Rows are strength bands: a grade uses the first row whose SMTS it does not exceed (+1 ksi tolerance, so X52 PSL2 at 66.7 ksi uses the ≤ 66 ksi row). Values are interpolated linearly in pressure. Pressures above the last column or SMTS above the last row are outside the table (the tool reports “—”).')) +
        card('Design factors and test ratios by location class', `<div class="tbl-wrap"><table class="grid edit"><thead><tr><th></th>${t.loc.map(l => `<th>${l}</th>`).join('')}</tr></thead><tbody>${arr('F_b318', 'B31.8 design factor F', 'R1')}${arr('F_A', 'B31.12 Option A F', 'R2')}${arr('F_B', 'B31.12 Option B F', 'R2')}${arr('hydro', 'Hydrotest / MAOP', 'R60')}</tbody></table></div>`) +
        obj('limits', 'Screening limits', note('hv* in HV10; ceIIW, pcm; S, P in wt %; cvn* in J; kih MPa√m; smys*/uts* in ksi; stress* in % SMYS; dent* in % OD; cpLimit V CSE. ' + ref('R2', 'R3', 'R4', 'R9', 'R33'))) +
        obj('fcg', 'Fatigue crack growth constants (CC2938 form, BS 7910 air)', note('da/dN = min(CL·(1+rL·R)/(1−R)·ΔK^mL·√(pH2/pRef), CH·(1+rH·R)/(1−R)·ΔK^mH); air: airC·ΔK^airM. lifeFactor = divisor on calculated life. ' + ref('R14', 'R16', 'R51'))) +
        obj('pir', 'Rupture fire (PIR) model parameters', note('XgH2 calibrated so that pure H2 reproduces the 0.47 code constant; XgNG = 0.2 reproduces ≈ 0.69 for NG (Verification V10/V11). ' + ref('R6', 'R7', 'R8'))) +
        `<div class="btns"><button class="btn ghost" type="button" id="tReset">Reset all tables to defaults</button><button class="btn ghost" type="button" id="tImp">Import tables (.json)</button></div>`;
    },
    bindPage(el) {
      const t = () => U.S.tables;
      el.addEventListener('change', e => {
        const x = e.target; const n = parseFloat(x.value);
        if (x.dataset.hf) { const [i, j] = x.dataset.hf.split('_').map(Number); t().hf.rows[i].hf[j] = n; }
        else if (x.dataset.hfp) t().hf.p_psig[+x.dataset.hfp] = n;
        else if (x.dataset.hfs) t().hf.rows[+x.dataset.hfs].smts_ksi = n;
        else if (x.dataset.arr) { const [k, i] = x.dataset.arr.split('_'); t()[k][+i] = n; }
        else if (x.dataset.obj) { const [k, f] = x.dataset.obj.split('.'); t()[k][f] = x.type === 'checkbox' ? x.checked : n; }
        else return;
        U.save(); U.toast('Table value updated.', { ms: 2000 });
      });
      U.$('#tReset', el).onclick = () => { U.S.tables = U.clone(D.DEFAULT_TABLES); U.save(); window.H2App.go('codes'); U.toast('Code tables reset to defaults.'); };
      U.$('#tImp', el).onclick = () => U.pickFile('.json', txt => { try { U.S.tables = Object.assign(U.clone(D.DEFAULT_TABLES), JSON.parse(txt)); U.save(); window.H2App.go('codes'); U.toast('Tables imported.'); } catch (e) { U.toast('Invalid JSON file.'); } });
    }
  });

  /* ================================================================ VERIFY */
  MODS.push({
    id: 'verify', group: 'Data & QA', nav: 'Verification cases', title: 'Verification against published values and independent calculations',
    intro: 'Synthetic test cases compare the engine with tabulated standard values, worked examples and an independent Python implementation (tests/hand_calcs.py, with GERG-2008 compressibility from CoolProp). Re-run after editing code tables.',
    page() {
      const cases = E.verificationCases(U.S.tables); const pass = cases.filter(c => c.pass).length;
      return card(`Result: ${chip(pass === cases.length ? 'g' : 'a', `${pass} / ${cases.length} cases pass`)}`, table(['ID', 'Case', 'Computed', 'Expected', 'Tolerance', 'Unit', 'Status', 'Basis of expected value', 'Ref'],
        cases.map(c => [c.id, c.name, fmt(c.computed, Math.abs(c.expected) < 0.01 ? 4 : 4), fmt(c.expected, 4), '± ' + c.tolPct + ' %', c.unit, chip(c.pass ? 'g' : 'r', c.pass ? 'Pass' : 'Fail'), c.basis, ref(c.ref)])) +
        note('V08 checks the lookup against whatever is in Code tables; V11 depends on the calibrated XgH2. Z (V05/V06) is the main model uncertainty: ±1.5 % vs GERG-2008 for 10–100 bar, 0–40 °C (mean |error| 0.6 %). Use the Z calibration multiplier in Gas properties to match AGA 8 / GERG values for your gas.')) +
        card('Synthetic project cases built into the tool', `<ol class="steps"><li><b>24" X52 HFW trunkline, 120 km, MAOP 70 barg</b> (Project) — repurposing re-rates to ≈ 56 barg under Option A Class 1.</li><li><b>20 % blend</b> in the same line — capacity, compression-energy and Wobbe effects.</li><li><b>500 t/d pure-H2 line, 150 km, 60 → 30 barg</b> (New design) — size screening and specification.</li><li><b>12-anomaly ILI listing</b> (ILI) and <b>60-day hourly SCADA history</b> (Fatigue) — synthetic data sets.</li><li><b>RLNG CGD network at 10 % H2</b> (CGD) — Wobbe interchangeability.</li></ol>`);
    },
    bindPage() { }
  });

  /* ================================================================ REFERENCES */
  MODS.push({
    id: 'refs', group: 'Data & QA', nav: 'References', title: 'References',
    intro: 'Sources for every correlation, code value and limit. Reference tags (e.g. R2) appear next to results throughout the tool.',
    page() {
      return card('Reference list', table(['Tag', 'Source', 'Title', 'Used for'], Object.entries(D.REFS).sort((a, b) => +a[0].slice(1) - +b[0].slice(1)).map(([k, r]) => ({ _cls: 'ref-' + k, cells: [`<b id="ref-${k}">${k}</b>`, esc(r[0]), esc(r[1]), esc(r[2])] }))));
    },
    bindPage(el) { const id = window.H2App.refTarget; if (id) { const row = U.$('.ref-' + id, el); if (row) { row.classList.add('hit'); row.scrollIntoView({ block: 'center' }); } window.H2App.refTarget = null; } }
  });

  /* ================================================================ ABOUT */
  MODS.push({
    id: 'about', group: 'Data & QA', nav: 'About & limitations', title: 'About this tool and its limitations',
    intro: 'H2 Pipeline Suite is a screening-level engineering workbook for hydrogen transport by pipeline. It runs entirely in your browser — no installation, no internet needed after opening.',
    page() {
      return card('Scope', `<ul class="steps"><li>Three transport routes: repurposed NG pipeline (100 % H2), new H2 pipeline, H2 blended into NG pipelines — plus CGD blending.</li><li>Steady-state hydraulics (isothermal), real-gas Z (Peng–Robinson + volume translation), ISO 6976 heating values and Wobbe index.</li><li>Mechanical design to ASME B31.12 (Option A/B) and B31.8; flaw assessment (Modified B31G, LEFM with CC2938 hydrogen FCG curves).</li><li>Consequence models: choked release, notional nozzle, Froude-number flame length, point-source radiation, jet dispersion to LFL, TNT equivalence, PIR.</li></ul>`) +
        card('Limitations — read before use', `<ul class="steps"><li>Results are for screening, option comparison and specification drafting. Final design, MAOP establishment and safety studies must be performed and checked by competent engineers with licensed standards and validated software (e.g. AGA 8/GERG-2008, transient hydraulics, PHAST/HyRAM+, full ECA).</li><li>Code values are transcribed and <b>editable</b> (Code tables). Verify against your edition.</li><li>Hydraulics are steady and isothermal; Joule–Thomson cooling, transients and line-pack dynamics are not modelled.</li><li>Consequence models neglect wind, terrain, crater formation and obstacles; jet-fire radiation uses a single point source.</li><li>Fatigue uses semi-elliptical surface-flaw solutions in a flat plate with a bulging correction; residual stresses and weld misalignment are not included.</li></ul>`) +
        card('Portability', `<p>Single HTML file. Works offline in Chrome, Edge, Firefox and Safari on Windows and macOS. Data is stored in your browser and in project files you save. Version 1.0 (${new Date().getFullYear()}).</p>`);
    },
    bindPage() { }
  });
})();

/* =====================================================================
   H2 Pipeline Suite — application shell & router
   ===================================================================== */
(function () {
  'use strict';
  const U = window.H2U, MODS = window.H2M, E = window.H2E;
  const { $, $$, esc } = U;
  const App = window.H2App = { refTarget: null, current: null, last: null, go(id) { if (location.hash.slice(1) !== id) location.hash = id; else render(id); } };

  function buildNav() {
    const groups = []; for (const m of MODS) { let g = groups.find(x => x.g === m.group); if (!g) groups.push(g = { g: m.group, items: [] }); g.items.push(m); }
    $('#nav').innerHTML = groups.map(g => `<div class="ng"><p class="ngt">${esc(g.g)}</p>${g.items.map(m => `<a href="#${m.id}" data-id="${m.id}">${esc(m.nav)}</a>`).join('')}</div>`).join('');
    $('#navSel').innerHTML = groups.map(g => `<optgroup label="${esc(g.g)}">${g.items.map(m => `<option value="${m.id}">${esc(m.nav)}</option>`).join('')}</optgroup>`).join('');
    $('#navSel').onchange = e => App.go(e.target.value);
  }

  let timer = null;
  function render(id) {
    const mod = MODS.find(m => m.id === id) || MODS[0]; App.current = mod;
    $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === mod.id)); $('#navSel').value = mod.id;
    $('#projTitle').textContent = U.S.meta.project || 'Untitled project';
    const main = $('#main');
    const head = `<header class="mh"><p class="eyebrow">${esc(mod.group)}</p><h2>${esc(mod.title)}</h2><p class="intro">${mod.intro || ''}</p>`;
    if (mod.page) {
      main.innerHTML = head + '</header>' + `<div class="pagebody">${mod.page()}</div>`;
      mod.bindPage && mod.bindPage($('.pagebody', main));
      main.focus({ preventScroll: true }); window.scrollTo(0, 0); return;
    }
    const v = U.moduleValues(mod);
    const hasShare = U.sections(mod).some(s => s.fields.some(f => f.share)) && mod.id !== 'project';
    main.innerHTML = head + `<div class="toolbar">
        ${hasShare ? '<button class="btn sm" type="button" data-t="fill">Fill from project</button>' : ''}
        <button class="btn sm ghost" type="button" data-t="reset">Reset inputs</button>
        <button class="btn sm ghost" type="button" data-t="rep">Export report (.html)</button>
        <button class="btn sm ghost" type="button" data-t="doc">Report for Word (.doc)</button>
        <button class="btn sm ghost" type="button" data-t="csv">Results table (.csv)</button></div></header>
      <div class="mgrid"><form class="inputs" id="inputs" autocomplete="off">${mod.extra ? mod.extra(v) : ''}${U.sections(mod).map(s => `<fieldset class="sec"><legend>${esc(s.title)}</legend><div class="formgrid">${s.fields.map(f => U.fieldHTML(mod.id, f, v[f.k])).join('')}</div></fieldset>`).join('')}</form>
      <div class="results" id="results" aria-live="polite"></div></div>`;
    const form = $('#inputs', main);
    form.addEventListener('submit', e => e.preventDefault());
    const rerun = () => { clearTimeout(timer); timer = setTimeout(() => compute(mod), 180); };
    form.addEventListener('input', e => {
      const k = e.target.dataset.k; if (!k) return;
      const f = U.sections(mod).flatMap(s => s.fields).find(x => x.k === k); if (!f) return;
      v[k] = U.readField(f, e.target); U.save();
      if (f.k === 'eq') { render(mod.id); return; }
      rerun();
    });
    form.addEventListener('change', e => { if (e.target.tagName === 'SELECT' && e.target.dataset.k === 'eq') return; });
    mod.bind && mod.bind(form, rerun);
    $$('.toolbar [data-t]', main).forEach(b => b.onclick = () => toolbar(mod, b.dataset.t));
    compute(mod);
    main.focus({ preventScroll: true });
  }

  function compute(mod) {
    const out = $('#results'); if (!out) return;
    const v = U.S.m[mod.id];
    try {
      const res = mod.compute(v) || { html: '' }; App.last = res;
      out.innerHTML = res.html; mod.after && mod.after(out, res, v);
      if (mod.id === 'project') $('#projTitle').textContent = U.S.meta.project || 'Untitled project';
    } catch (e) {
      console.error(e);
      out.innerHTML = `<section class="rcard"><h3>Calculation could not be completed</h3><p class="note warn">${esc(e.message)}. Check the inputs for zero or negative values (e.g. wall thickness, pressures, lengths).</p></section>`;
    }
  }

  function toolbar(mod, t) {
    const v = U.S.m[mod.id];
    if (t === 'fill') {
      const p = U.S.m.project || {}; let n = 0;
      for (const s of U.sections(mod)) for (const f of s.fields) if (f.share && p[f.share] !== undefined) { v[f.k] = p[f.share]; n++; }
      U.save(); render(mod.id); U.toast(`${n} values filled from the project set-up.`);
    }
    if (t === 'reset') { delete U.S.m[mod.id]; U.save(); render(mod.id); U.toast('Inputs reset to defaults.'); }
    const res = App.last || { html: '' }; const fname = `${mod.id}_${(U.S.meta.project || 'project').replace(/[^\w-]+/g, '_').slice(0, 40)}`;
    if (t === 'rep') U.download(fname + '.html', U.reportHTML(mod, res.html), 'text/html');
    if (t === 'doc') U.download(fname + '.doc', U.reportHTML(mod, res.html), 'application/msword');
    if (t === 'csv') { if (res.csv) U.download(fname + '_' + res.csv.name + '.csv', U.toCSV(res.csv.rows), 'text/csv'); else U.toast('This module has no tabular results to export.'); }
  }

  function theme(cycle) {
    const order = ['auto', 'light', 'dark']; let th = U.S.settings.theme || 'auto';
    if (cycle) { th = order[(order.indexOf(th) + 1) % 3]; U.S.settings.theme = th; U.save(); }
    if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
    $('#themeBtn').textContent = { auto: 'Theme: system', light: 'Theme: light', dark: 'Theme: dark' }[th];
  }

  document.addEventListener('click', e => {
    const a = e.target.closest('a.ref'); if (a) { e.preventDefault(); App.refTarget = a.dataset.ref; App.go('refs'); return; }
  });

  async function start() {
    U.load(); buildNav(); theme(false);
    $('#themeBtn').onclick = () => theme(true);
    $('#copyClose').onclick = () => { $('#copyDlg').hidden = true; };
    await U.LIB.open();
    window.addEventListener('hashchange', () => render(location.hash.slice(1)));
    render(location.hash.slice(1) || 'project');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
